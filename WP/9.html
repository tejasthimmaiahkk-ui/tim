<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Types Example</title>
<link rel="stylesheet" href="9.css">
<style>
h2 {
color: darkgreen;
text-align: center;
}
p {
font-size: 18px;
color: navy;
}
</style>
</head>
<body>
<main class="demo-panel">
<h1 style="color: red; text-align: center;">
Welcome to My Webpage<hr>
</h1>
<h2>Using Internal CSS</h2>
<p>
This paragraph is styled using internal CSS.
</p>
<div class="box">
This box is styled using external CSS.
</div>
</main>
</body>
</html>
