<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, hight=device-hight, initial-scale=1.0">

    <title>CSS Box Model</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            border: 3px solid #333;
            padding: 20px;
            background-color: #fff;
        }

        .box {
            width: 250px;
            height: 150px;
            background-color: lightblue;
            border: 5px solid blue;
            padding: 20px;
            margin: 20px;
            text-align: center;
            line-height: 110px;
            font-weight: bold;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            border: 2px dashed green;
            background-color: #cffeea;
        }

    </style>

</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="container">

        <div class="box">
            Box Content
        </div>

        <div class="info">

            <h3>Box Model Components</h3>

            <ul>
                <li>
                    <strong>Content:</strong>
                    The text inside
                </li>

                <li>
                    <strong>Padding:</strong>
                    Space between content and border
                </li>

                <li>
                    <strong>Border:</strong>
                    Padding & Content
                </li>

                <li>
                    <strong>Margin:</strong>
                    Margin side
                </li>
            </ul>

        </div>

    </div>

</body>

</html>
