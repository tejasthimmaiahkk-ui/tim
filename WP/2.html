<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Formatting Tags</title>
  <link rel="stylesheet" href="2.css">
</head>
<body>
  <main class="format-card">
    <h1>Text Formatting Tags in HTML</h1>
    <section class="examples" aria-label="Text formatting examples">
      <p><b>This text is Bold.</b></p>
      <p><i>This text is Italic.</i></p>
      <p><u>This text is Underlined.</u></p>
      <p>Water is represented as H<sub>2</sub>O.</p>
      <p>The formula for the area of a square is A = a<sup>2</sup>.</p>
      <p class="combined"><b>Bold</b>, <i>Italic</i>, <u>Underline</u>, H<sub>2</sub>SO<sub>4</sub>, x<sup>3</sup> + y<sup>3</sup></p>
    </section>
  </main>
</body>
</html>
