<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Displaying Images in HTML</title>
<link rel="stylesheet" href="4.css">
</head>
<body>
<main class="page-shell">
<header class="page-header">
<h1>Displaying Images in HTML</h1>
</header>
<section class="gallery" aria-label="College facilities">
<article class="photo-card">
<h2>College Building</h2>
<img src="c.jpeg" alt="College Building" width="200" height="125">
</article>
<article class="photo-card">
<h2>Computer Laboratory</h2>
<img src="la.png" alt="Computer Laboratory" width="200" height="125">
</article>
<article class="photo-card">
<h2>Library</h2>
<img src="lib.png" alt="College Library" width="200" height="125">
</article>
</section>
</main>
</body>
</html>
